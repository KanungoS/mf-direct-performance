name: MF Daily Performance Update

on:
  schedule:
    - cron: "0 3 * * *"   # 8:30 AM IST
  workflow_dispatch:

jobs:
  run-mf:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download NAV history base
        run: |
          mkdir -p data

          ASSET_URL=$(curl -s \
            https://api.github.com/repos/KanungoS/mf-direct-performance/releases \
            | jq -r '.[0].assets[] | select(.name=="nav_history.zip") | .url')

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "nav_history.zip not found in releases"
            exit 1
          fi

          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o nav_history.zip

          if [ ! -s nav_history.zip ]; then
            echo "Download failed"
            exit 1
          fi

          unzip -o nav_history.zip -d data
          rm nav_history.zip

      - name: Run Core MF Engine
        run: python scripts/mf_core_engine.py

      - name: Run Tactical MF Engine
        run: python scripts/mf_tactical_engine.py

      - name: Run Portfolio Engine
        run: python scripts/portfolio_engine.py

      - name: Commit outputs
        run: |
          git config user.name "mf-engine"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Daily MF update" || echo "No changes to commit"
          git push
