name: MF Daily Performance Update

on:
  schedule:
    - cron: "0 3 * * *"   # 8:30 AM IST
  workflow_dispatch:

jobs:
  run-mf:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download NAV history base (Robust Dynamic Method)
        run: |
          mkdir -p data

          echo "Fetching latest release info..."

          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/KanungoS/mf-direct-performance/releases/latest \
            -o latest_release.json

          DOWNLOAD_URL=$(jq -r '.assets[0].url' latest_release.json)

          if [ "$DOWNLOAD_URL" == "null" ]; then
            echo "No release assets found!"
            exit 1
          fi

          echo "Downloading NAV history asset..."

          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$DOWNLOAD_URL" \
            -o nav_history.zip

          if [ ! -s nav_history.zip ]; then
            echo "Download failed or empty file."
            exit 1
          fi

          echo "Unzipping NAV history..."
          unzip -o nav_history.zip -d data

          rm nav_history.zip latest_release.json

      - name: Run Core MF Engine
        run: python scripts/mf_core_engine.py

      - name: Run Tactical MF Engine
        run: python scripts/mf_tactical_engine.py

      - name: Run Portfolio Engine
        run: python scripts/portfolio_engine.py

      - name: Commit outputs
        run: |
          git config user.name "mf-engine"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Daily MF update" || echo "No changes to commit"
          git push
